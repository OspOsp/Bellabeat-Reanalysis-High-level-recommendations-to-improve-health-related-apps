<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="How the tracked day is spent">
<rect width="900" height="300" fill="#fcfcfb"/>
<text x="28.0" y="34.0" fill="#0b0b0b" font-size="16" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="600" text-anchor="start">Four fifths of the tracked day is sedentary</text>
<text x="28.0" y="54.0" fill="#52514e" font-size="12" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="400" text-anchor="start">Share of all recorded minutes across 863 wear-days, by intensity band</text>
<rect x="28.0" y="150" width="668.2" height="56" rx="4.0" fill="#184f95"/>
<text x="362.1" y="176.0" fill="#ffffff" font-size="15" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="600" text-anchor="middle">79.4%</text>
<text x="362.1" y="194.0" fill="#ffffff" font-size="12" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="400" text-anchor="middle">Sedentary</text>
<text x="362.1" y="228.0" fill="#898781" font-size="11" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="400" text-anchor="middle">956 min/day</text>
<rect x="698.2" y="150" width="145.3" height="56" rx="4.0" fill="#2a78d6"/>
<text x="770.9" y="176.0" fill="#ffffff" font-size="15" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="600" text-anchor="middle">17.4%</text>
<text x="770.9" y="194.0" fill="#ffffff" font-size="12" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="400" text-anchor="middle">Lightly active</text>
<text x="770.9" y="228.0" fill="#898781" font-size="11" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="400" text-anchor="middle">210 min/day</text>
<rect x="845.5" y="150" width="8.4" height="56" rx="4.0" fill="#5598e7"/>
<path d="M849.7 146.0 L849.7 124.0 L842.7 124.0" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="837.7" y="128.0" fill="#52514e" font-size="11" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="600" text-anchor="end">Fairly active  1.2%  (15 min/day)</text>
<rect x="855.9" y="150" width="16.1" height="56" rx="4.0" fill="#86b6ef"/>
<path d="M863.9 146.0 L863.9 98.0 L856.9 98.0" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="851.9" y="102.0" fill="#52514e" font-size="11" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="600" text-anchor="end">Very active  1.9%  (23 min/day)</text>
<text x="28.0" y="282.0" fill="#898781" font-size="10" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-weight="400" text-anchor="start">Non-wear days (0 steps) are excluded. Leaving them in, as the raw file invites, pushes the sedentary share to 81.3%.</text>
</svg>